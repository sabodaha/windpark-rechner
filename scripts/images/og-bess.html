<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url("__INTER__") format("woff2");
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: Inter, "Segoe UI", sans-serif;
        background: #1f2a3c;
        color: #ffffff;
      }
      .wrap {
        position: absolute;
        inset: 0;
        padding: 76px 84px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .kicker {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #aab4c3;
      }
      h1 {
        margin: 20px 0 0;
        max-width: 720px;
        font-size: 74px;
        line-height: 1.04;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .sub {
        margin-top: 26px;
        max-width: 700px;
        text-wrap: balance;
        font-size: 29px;
        line-height: 1.4;
        color: #d5dbe4;
      }
      .foot {
        display: flex;
        gap: 22px;
        font-size: 24px;
        color: #aab4c3;
      }
      .foot b {
        color: #ffffff;
        font-weight: 600;
      }
      svg {
        position: absolute;
        right: 64px;
        top: 70px;
      }
    </style>
  </head>
  <body>
    <svg width="340" height="500" viewBox="0 0 340 500" aria-hidden="true">
      <!-- battery -->
      <rect x="70" y="40" width="200" height="300" rx="22" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.92" />
      <rect x="130" y="14" width="80" height="30" rx="8" fill="#ffffff" opacity="0.92" />
      <rect x="96" y="230" width="148" height="84" rx="8" fill="#1baf7a" />
      <rect x="96" y="134" width="148" height="84" rx="8" fill="#1baf7a" opacity="0.55" />
      <!-- price curve over a day -->
      <path d="M18 470 C60 430 90 445 120 455 C150 465 175 470 200 440 C225 410 250 385 280 392 C300 397 312 420 322 430" fill="none" stroke="#eda100" stroke-width="7" stroke-linecap="round" />
      <circle cx="160" cy="463" r="8" fill="#2a78d6" />
      <circle cx="280" cy="392" r="8" fill="#eb6834" />
    </svg>
    <div class="wrap">
      <div>
        <div class="kicker">Igor Sabodakha</div>
        <h1>Battery Storage Investment Calculator</h1>
        <div class="sub">An open project-finance model of a battery in Ukraine: day-ahead trading, war&nbsp;risk, euro&nbsp;debt, Ukrainian&nbsp;tax.</div>
      </div>
      <div class="foot"><b>igorsabodakha.com</b><span>Sources and assumptions disclosed</span></div>
    </div>
  </body>
</html>
